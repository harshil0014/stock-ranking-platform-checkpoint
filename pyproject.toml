[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-ranking-platform"
version = "0.2.0"
description = "Offline explainable stock-ranking research foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2,<4",
]

[project.scripts]
stock-ranker = "stock_ranker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
testpaths = ["tests"]
